---
- name: Build list of non-absent users
  ansible.builtin.set_fact:
    _present_users: >-
      {{ users | rejectattr('state', 'defined') | list
         + (users | selectattr('state', 'defined')
                  | rejectattr('state', 'equalto', 'absent') | list) }}

- name: Snapshot existing accounts before creation
  ansible.builtin.getent:
    database: passwd

- name: Snapshot existing groups before creation
  ansible.builtin.getent:
    database: group

- name: Record which usernames already exist
  ansible.builtin.set_fact:
    _existing_usernames: "{{ ansible_facts.getent_passwd.keys() | list }}"

- name: Fail if a requested UID is already used by another account
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.getent_passwd | dict2items
          | rejectattr('key', 'equalto', item.username)
          | selectattr('value.1', 'equalto', item.uid | string)
          | list | length) == 0
    fail_msg: "UID {{ item.uid }} for user '{{ item.username }}' is already in use by another account."
    quiet: true
  loop: "{{ _present_users }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.uid is defined

- name: Fail if a requested GID is already used by another group
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.getent_group | dict2items
          | rejectattr('key', 'equalto', item.key)
          | selectattr('value.1', 'equalto', item.value | string)
          | list | length) == 0
    fail_msg: "GID {{ item.value }} for group '{{ item.key }}' is already in use by another group."
    quiet: true
  loop: "{{ (group_gids | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure supplementary groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    gid: "{{ (group_gids | default({}))[item] | default(omit) }}"
    non_unique: false
    state: present
  loop: "{{ _present_users | map(attribute='groups', default=[]) | flatten | unique }}"

- name: Manage user accounts
  ansible.builtin.user:
    name: "{{ item.username }}"
    uid: "{{ item.uid | default(omit) }}"
    non_unique: false
    comment: "{{ item.fullname | default(omit) }}"
    groups: "{{ item.groups | default([]) | join(',') | default(omit, true)}}"
    append: false
    password: "{{ item.password | default(omit) }}"
    update_password: on_create
    shell: "{{ user_default_shell }}"
    create_home: "{{ user_create_home }}"
    remove: "{{ (item.remove_home | default(user_remove_home_on_delete)) if (item.state | default('present') == 'absent') else omit }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  no_log: true
  register: managed_users

- name: Look up account home directories
  ansible.builtin.getent:
    database: passwd

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[item.username][4] }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ ansible_facts.getent_passwd[item.username][2] }}"
    mode: "0700"
  loop: "{{ _present_users }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - item.ssh_keys | default([]) | length > 0
    - ansible_facts.getent_passwd[item.username] is defined
    - ansible_facts.getent_passwd[item.username][4] | default('') | length > 0

- name: Manage authorized SSH keys
  ansible.builtin.copy:
    dest: "{{ ansible_facts.getent_passwd[item.username][4] }}/.ssh/authorized_keys"
    content: "{{ item.ssh_keys | join('\n') }}\n"
    owner: "{{ item.username }}"
    group: "{{ ansible_facts.getent_passwd[item.username][2] }}"
    mode: "0600"
  loop: "{{ _present_users }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - item.ssh_keys | default([]) | length > 0
    - ansible_facts.getent_passwd[item.username] is defined
    - ansible_facts.getent_passwd[item.username][4] | default('') | length > 0

- name: Force password change at first login for new accounts
  ansible.builtin.command:
    cmd: "chage -d 0 {{ item.username }}"
  loop: "{{ _present_users }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - user_force_password_change | bool
    - item.password is defined
    - item.username not in _existing_usernames
  changed_when: true

- name: Grant sudo access via sudoers drop-in
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ item.username }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - item.sudo | default(false)
    - item.state | default('present') != 'absent'

- name: Remove sudo drop-in when disabled or user removed
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.username }}"
    state: absent
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  when: >
    (not (item.sudo | default(false)))
    or (item.state | default('present') == 'absent')
